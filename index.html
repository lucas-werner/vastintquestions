<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vastint Privacy Champions Guidelines Quiz</title>
  <meta name="description" content="Action-based quiz for the Vastint Privacy Champions Guidelines training." />
  <style>
    :root{--ink:#191919;--charcoal:#2f3132;--grey:#626466;--panel:#f0eee9;--paper:#faf9f6;--line:#d7d3ca;--accent:#c86f62;--ok:#2d7a4f;--bad:#b33a3a;--shadow:0 22px 60px rgba(25,25,25,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);line-height:1.45}button{font:inherit}.shell{width:min(980px,calc(100vw - 32px));margin:auto;padding:24px 0 44px}.start-screen{min-height:calc(100vh - 68px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}.start-logo{width:178px;height:54px;display:grid;place-items:center}.start-logo img{max-width:168px;max-height:38px;display:block}.start-logo span{display:none;color:var(--ink);font-weight:900;letter-spacing:-.08em;font-size:30px}.start-logo.bad img{display:none}.start-logo.bad span{display:block}.start-title{margin:0;color:var(--ink);font-size:clamp(1.8rem,5vw,3.6rem);line-height:1;letter-spacing:-.055em;font-weight:850}.panel{border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}.quiz,.result{display:none;margin-top:22px;padding:clamp(22px,4vw,40px)}.active{display:block}.hidden{display:none!important}.qhead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.counter{color:var(--ink);font-weight:850}.track{flex:1;min-width:120px;height:10px;background:var(--panel);border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ink));border-radius:inherit;transition:width .24s}.qtext{margin:0 0 22px;color:var(--ink);font-size:clamp(1.45rem,3vw,2.15rem);line-height:1.14;letter-spacing:-.04em}.answers{display:grid;gap:12px;margin-bottom:22px}.answer{width:100%;text-align:left;border:1px solid var(--line);color:var(--charcoal);background:#fff;border-radius:0;padding:16px 18px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;cursor:pointer;transition:.14s}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent);box-shadow:0 10px 24px rgba(25,25,25,.10)}.answer:focus-visible,.btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(200,111,98,.25)}.answer:disabled{cursor:default}.letter{display:grid;place-items:center;width:34px;height:34px;background:var(--panel);color:var(--ink);font-weight:850}.correct{border-color:rgba(45,122,79,.55);background:rgba(45,122,79,.09)}.correct .letter{background:var(--ok);color:#fff}.wrong{border-color:rgba(179,58,58,.48);background:rgba(179,58,58,.08)}.wrong .letter{background:var(--bad);color:#fff}.feedback{display:none;border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-bottom:22px}.feedback.active{display:block}.feedback strong{display:block;color:var(--ink);margin-bottom:4px}.feedback p{margin:0;color:var(--charcoal)}.qactions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:0;padding:13px 20px;cursor:pointer;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;transition:.14s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(25,25,25,.14)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{color:#fff;background:var(--ink)}.secondary{color:var(--ink);background:#fff;border:1px solid var(--line)}.ghost{color:var(--ink);background:transparent}.start-btn{font-size:clamp(1.4rem,4vw,2.8rem);padding:24px 42px;min-height:76px;letter-spacing:-.035em}.ring{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--angle),var(--panel) 0deg);margin-bottom:22px;box-shadow:inset 0 0 0 13px rgba(255,255,255,.75)}.ring span{width:98px;height:98px;border-radius:inherit;display:grid;place-items:center;color:var(--ink);background:#fff;font-size:1.85rem;font-weight:900;letter-spacing:-.06em}.eyebrow{margin:0;color:var(--accent);font-size:.83rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850}.result h2{margin:0;color:var(--ink);font-size:clamp(2rem,5vw,3.8rem);line-height:1;letter-spacing:-.065em}.result-copy{margin:14px 0 0;max-width:720px;color:var(--grey);font-size:1.04rem}.review{margin:28px 0 0;display:grid;gap:10px}.review-item{border:1px solid var(--line);padding:14px 16px;background:#fff;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}.icon{width:30px;height:30px;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--ok)}.missed{background:var(--bad)}.review-item p{margin:0}.review-item small{color:var(--grey)}@media(max-width:760px){.qhead{align-items:flex-start;flex-direction:column}.track{width:100%}.start-btn{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="start-screen" id="intro">
      <div class="start-logo" id="logo"><img src="https://vastint.eu/wp-content/uploads/2025/11/logo-main.svg" alt="Vastint logo" onerror="document.getElementById('logo').classList.add('bad')"><span>VASTINT</span></div>
      <h1 class="start-title">Privacy Quiz - Privacy Champions</h1>
      <button class="btn primary start-btn" id="start">Start Quiz</button>
      <button class="btn secondary hidden" id="resume">Resume Quiz</button>
    </section>

    <section class="panel quiz" id="quiz" aria-live="polite"><div class="qhead"><div class="counter" id="counter">Question 1 of 10</div><div class="track"><div class="fill" id="fill"></div></div></div><h2 class="qtext" id="qtext"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"><strong id="ftitle"></strong><p id="ftext"></p></div><div class="qactions"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next" disabled>Next</button></div></section>
    <section class="panel result" id="result" aria-live="polite"><div class="ring" id="ring" style="--angle:0deg"><span id="score">0/10</span></div><p class="eyebrow">Result</p><h2 id="rtitle">Completed.</h2><p class="result-copy" id="rcopy"></p><div class="review" id="review"></div><div class="actions"><button class="btn primary" id="restart">Retake Quiz</button><button class="btn secondary" id="copy">Copy Result</button></div></section>
  </main>
  <script type="module">
    const questions=Object.freeze([{prompt:"What is the Privacy Champion's role for routine privacy matters?",options:["Act as first contact and inform the Privacy Officer on routine matters such as ROPA updates, new vendors and standard notices.","Make final decisions on all privacy risks without involving anyone else.","Send every privacy question directly to IT.","Only respond when a regulator contacts Vastint."],answer:0,explanation:"Privacy Champions are the first contact for routine privacy topics and should keep the Privacy Officer informed.",topic:"Privacy Champion role"},{prompt:"Which matter must be escalated to the DPO?",options:["A minor spelling correction in a standard privacy notice.","A suspected breach, DPIA, regulator contact, data subject complaint or high-risk processing.","A routine update to the team contact list.","A request to find the latest template in Teams."],answer:1,explanation:"High-risk matters go to the DPO, including suspected breaches, DPIAs, regulator contact, complaints and high-risk processing.",topic:"Escalation to DPO"},{prompt:"What must be true about the ROPA?",options:["It can contain placeholders if the team plans to complete it later.","It only needs to list systems that had a breach.","It must be complete, current and free of placeholders.","It is updated only during external audits."],answer:2,explanation:"The ROPA must be maintained as a complete and current record. Placeholders are not acceptable.",topic:"ROPA quality"},{prompt:"What must the Privacy Champion do annually?",options:["Complete the Champion Annual Review Checklist.","Delete all old privacy documents and start again.","Send a new DPIA for every existing process.","Wait for the DPO to complete the local checklist."],answer:0,explanation:"The Annual Champion Review Checklist must be performed every year.",topic:"Annual checklist"},{prompt:"Where is the Annual Champion Review Checklist located?",options:["In the public Vastint website footer.","In Vastint [your country] > Assessments & Reports Privacy > Champion Annual Review Checklist.","Only in personal email archives.","In the recruitment folder."],answer:1,explanation:"The one-pager points to the local Teams channel: Vastint [your country] > Assessments & Reports Privacy > Champion Annual Review Checklist.",topic:"Checklist location"},{prompt:"A new vendor or website is introduced. What should the Privacy Champion check?",options:["Only whether the supplier has a professional website.","The correct Data Processing Agreement template and updates to the notice, cookie statement, banner and ROPA.","Nothing until a complaint is received.","Only whether the invoice has been approved."],answer:1,explanation:"New vendors and websites trigger privacy documentation checks: DPA template, privacy notice, cookie statement, banner and ROPA.",topic:"New vendor or website"},{prompt:"A new system or process will process personal data. What should happen first?",options:["Check DPIA need, review security and update the ROPA.","Approve it if the business owner says it is urgent.","Wait until after go-live to document it.","Use the system only for a pilot and skip privacy review."],answer:0,explanation:"For new systems or processes, check DPIA need, review security and update the ROPA. The DPO is the contact point for DPIAs.",topic:"New system or process"},{prompt:"What is required for CCTV?",options:["Use cameras first and prepare notices later if someone asks.","Follow the policy and notice, ensure signage and assess DPIA need for each location.","Only inform reception staff.","Keep signage generic and avoid mentioning monitoring."],answer:1,explanation:"CCTV requires the relevant policy and notice, visible signage and a DPIA assessment for each location.",topic:"CCTV"},{prompt:"What must happen in case of a suspected data breach?",options:["Notify IT and the DPO immediately through the approved reporting channels.","Wait until the next annual checklist.","Only tell the person who caused the incident.","Keep working and document it later if there is time."],answer:0,explanation:"Suspected breaches must be escalated immediately through the approved IT and privacy reporting channels.",topic:"Suspected breach"},{prompt:"Where should Privacy Champions find templates and what if no suitable template exists?",options:["Use any template found online; if unsure, leave sections blank.","Use Teams > Privacy Champions Team > General > Interogo's Templates; if no suitable template exists, ask the privacy mailbox.","Ask each local team to create its own template from scratch.","Use the previous year's document even if it is outdated."],answer:1,explanation:"Templates are in the Privacy Champions Team in Teams. If no suitable template exists, ask the privacy mailbox.",topic:"Templates and guidance"}]);
    const key="vastint-privacy-quiz-v4",$=s=>document.querySelector(s),el={intro:$("#intro"),quiz:$("#quiz"),result:$("#result"),start:$("#start"),resume:$("#resume"),restart:$("#restart"),copy:$("#copy"),counter:$("#counter"),fill:$("#fill"),qtext:$("#qtext"),answers:$("#answers"),feedback:$("#feedback"),ftitle:$("#ftitle"),ftext:$("#ftext"),back:$("#back"),next:$("#next"),ring:$("#ring"),score:$("#score"),rtitle:$("#rtitle"),rcopy:$("#rcopy"),review:$("#review")};
    const blank=()=>({started:false,complete:false,index:0,answers:Array(questions.length).fill(null),sessionId:crypto?.randomUUID?.()??String(Date.now())});let state=load()??blank();
    function load(){try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x?.answers)&&x.answers.length===questions.length?{...blank(),...x}:null}catch{return null}}function save(){localStorage.setItem(key,JSON.stringify(state));resumeBtn()}function clear(){localStorage.removeItem(key);resumeBtn()}function resumeBtn(){const s=load();el.resume.classList.toggle("hidden",!(s?.started&&!s?.complete))}function start(resume=false){if(!resume)state=blank();state.started=true;state.complete=false;save();render();el.quiz.scrollIntoView({block:"start"})}function score(){return state.answers.reduce((t,a,i)=>t+Number(a===questions[i].answer),0)}function render(){el.intro.classList.toggle("hidden",state.started);el.quiz.classList.toggle("active",state.started&&!state.complete);el.result.classList.toggle("active",state.complete);if(state.started&&!state.complete)renderQ();if(state.complete)renderR();resumeBtn()}function renderQ(){const q=questions[state.index],sel=state.answers[state.index],done=sel!==null,pct=((state.index+Number(done))/questions.length)*100;el.counter.textContent=`Question ${state.index+1} of ${questions.length}`;el.fill.style.width=`${Math.max(4,pct)}%`;el.qtext.textContent=q.prompt;el.answers.innerHTML="";q.options.forEach((text,i)=>{const b=document.createElement("button");b.className="answer";b.type="button";b.disabled=done;if(done&&i===q.answer)b.classList.add("correct");if(done&&i===sel&&sel!==q.answer)b.classList.add("wrong");b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${text}</span>`;b.onclick=()=>answer(i);el.answers.append(b)});el.feedback.classList.toggle("active",done);el.ftitle.textContent=done&&sel===q.answer?"Correct.":"Incorrect.";el.ftext.textContent=done?q.explanation:"";el.back.disabled=state.index===0;el.next.disabled=!done;el.next.textContent=state.index===questions.length-1?"See Result":"Next"}function answer(i){if(state.answers[state.index]!==null)return;state.answers[state.index]=i;save();renderQ()}function move(d){state.index=Math.min(Math.max(state.index+d,0),questions.length-1);save();renderQ()}function finish(){state.complete=true;save();renderR();el.result.scrollIntoView({block:"start"})}function renderR(){const total=score(),pct=Math.round(total/questions.length*100);el.intro.classList.add("hidden");el.quiz.classList.remove("active");el.result.classList.add("active");el.score.textContent=`${total}/${questions.length}`;el.ring.style.setProperty("--angle",`${pct*3.6}deg`);el.rtitle.textContent=pct>=80?"Passed.":"Review needed.";el.rcopy.textContent=pct>=80?"Score meets the suggested pass mark.":"Review the missed questions before applying the process in practice.";el.review.innerHTML="";questions.forEach((q,i)=>{const ok=state.answers[i]===q.answer,item=document.createElement("div");item.className="review-item";item.innerHTML=`<span class="icon ${ok?"":"missed"}">${ok?"✓":"!"}</span><div><p><strong>${i+1}. ${q.topic}</strong> - ${ok?"Correct":`Correct answer: ${q.options[q.answer]}`}</p><small>${q.explanation}</small></div>`;el.review.append(item)})}
    el.start.onclick=()=>start(false);el.resume.onclick=()=>start(true);el.back.onclick=()=>move(-1);el.next.onclick=()=>state.index===questions.length-1?finish():move(1);el.restart.onclick=()=>{clear();state=blank();start(false)};el.copy.onclick=async()=>{const t=`Vastint Privacy Champions Guidelines quiz result: ${score()}/${questions.length}`;try{await navigator.clipboard.writeText(t);el.copy.textContent="Copied";setTimeout(()=>el.copy.textContent="Copy Result",1200)}catch{el.copy.textContent=t}};window.addEventListener("keydown",e=>{if(!state.started||state.complete)return;const sel=state.answers[state.index];if(["1","2","3","4"].includes(e.key)&&sel===null)answer(Number(e.key)-1);if((e.key==="Enter"||e.key==="ArrowRight")&&sel!==null)(state.index===questions.length-1?finish():move(1));if(e.key==="ArrowLeft")move(-1)});render();
  </script>
</body>
</html>
