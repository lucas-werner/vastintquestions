<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vastint Privacy Champions Training</title>
  <meta name="description" content="Post-training quiz for Vastint Privacy Champions Training." />
  <style>
    :root{--blue:#006f9f;--navy:#0a3446;--sky:#d9eef7;--graphite:#3a3a37;--stone:#ebe8df;--warm:#f7f4eb;--white:#fff;--ok:#2d7a4f;--bad:#b33a3a;--shadow:0 24px 70px rgba(10,52,70,.16);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--warm),#fff 58%,var(--sky));color:var(--graphite);line-height:1.5}button{font:inherit}.shell{width:min(940px,calc(100vw - 32px));margin:auto;padding:28px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:14px}.logo{width:150px;min-width:150px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--navy);box-shadow:0 12px 30px rgba(10,52,70,.16);overflow:hidden;padding:10px 14px}.logo img{max-width:118px;max-height:26px;display:block;filter:brightness(0) invert(1)}.logo span{display:none;color:#fff;font-weight:900;letter-spacing:-.08em;font-size:26px}.logo.bad img{display:none}.logo.bad span{display:block}.eyebrow{margin:0;color:rgba(58,58,55,.72);font-size:.88rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800}.small-title{margin:2px 0 0;color:var(--navy);font-weight:800;font-size:1.08rem}.chip{border:1px solid rgba(0,111,159,.18);color:var(--navy);background:rgba(255,255,255,.70);backdrop-filter:blur(18px);border-radius:999px;padding:9px 14px;font-size:.9rem;font-weight:750;white-space:nowrap}.panel{border:1px solid rgba(0,111,159,.14);background:rgba(255,255,255,.82);backdrop-filter:blur(20px);box-shadow:var(--shadow);border-radius:30px}.intro{padding:clamp(30px,6vw,64px);text-align:left}.intro h1{margin:10px 0 0;color:var(--navy);font-size:clamp(2.3rem,7vw,5rem);line-height:.98;letter-spacing:-.075em;max-width:760px}.lede{margin:20px 0 0;max-width:560px;font-size:1.08rem;color:rgba(58,58,55,.78)}.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.meta span{border:1px solid rgba(10,52,70,.1);background:var(--warm);border-radius:999px;padding:8px 12px;font-weight:750;color:var(--navy)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.quiz,.result{display:none;margin-top:22px;padding:clamp(22px,4vw,40px)}.active{display:block}.hidden{display:none!important}.qhead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.counter{color:var(--navy);font-weight:850}.track{flex:1;min-width:120px;height:11px;background:rgba(0,111,159,.12);border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--navy));border-radius:inherit;transition:width .24s}.qtext{margin:0 0 22px;color:var(--navy);font-size:clamp(1.45rem,3vw,2.1rem);line-height:1.14;letter-spacing:-.04em}.answers{display:grid;gap:12px;margin-bottom:22px}.answer{width:100%;text-align:left;border:1px solid rgba(10,52,70,.12);color:var(--graphite);background:#fff;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;cursor:pointer;transition:.14s}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(0,111,159,.36);box-shadow:0 10px 24px rgba(10,52,70,.10)}.answer:focus-visible,.btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,111,159,.24)}.answer:disabled{cursor:default}.letter{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--stone);color:var(--navy);font-weight:850}.correct{border-color:rgba(45,122,79,.45);background:rgba(45,122,79,.09)}.correct .letter{background:var(--ok);color:#fff}.wrong{border-color:rgba(179,58,58,.42);background:rgba(179,58,58,.08)}.wrong .letter{background:var(--bad);color:#fff}.feedback{display:none;border-radius:20px;border:1px solid rgba(0,111,159,.14);background:var(--warm);padding:16px 18px;margin-bottom:22px}.feedback.active{display:block}.feedback strong{display:block;color:var(--navy);margin-bottom:4px}.feedback p{margin:0;color:rgba(58,58,55,.78)}.qactions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:13px 20px;cursor:pointer;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;transition:.14s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(10,52,70,.16)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy))}.secondary{color:var(--navy);background:rgba(255,255,255,.84);border:1px solid rgba(0,111,159,.16)}.ghost{color:var(--navy);background:transparent}.ring{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--angle),rgba(0,111,159,.12) 0deg);margin-bottom:22px;box-shadow:inset 0 0 0 13px rgba(255,255,255,.76)}.ring span{width:98px;height:98px;border-radius:inherit;display:grid;place-items:center;color:var(--navy);background:#fff;font-size:1.85rem;font-weight:900;letter-spacing:-.06em}.result h2{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3.8rem);line-height:1;letter-spacing:-.065em}.result-copy{margin:14px 0 0;max-width:720px;color:rgba(58,58,55,.78);font-size:1.04rem}.review{margin:28px 0 0;display:grid;gap:10px}.review-item{border:1px solid rgba(10,52,70,.10);border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.70);display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}.icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--ok)}.missed{background:var(--bad)}.review-item p{margin:0}.review-item small{color:rgba(58,58,55,.66)}@media(max-width:760px){.topbar{align-items:flex-start}.brand{align-items:flex-start}.chip{display:none}.meta{display:grid}.qhead{align-items:flex-start;flex-direction:column}.track{width:100%}.logo{width:128px;min-width:128px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo" id="logo"><img src="https://vastint.eu/wp-content/uploads/2025/11/logo-main.svg" alt="Vastint logo" onerror="document.getElementById('logo').classList.add('bad')"><span>VASTINT</span></div><div><p class="eyebrow">Training quiz</p><p class="small-title">Vastint</p></div></div>
      <div class="chip" id="status">Ready · 10 questions</div>
    </header>

    <section class="panel intro" id="intro">
      <p class="eyebrow">Post-training quiz</p>
      <h1>Vastint Privacy Champions Training</h1>
      <p class="lede">10 questions. Choose one answer per question.</p>
      <div class="meta"><span>10 questions</span><span>Suggested pass mark: 80%</span></div>
      <div class="actions"><button class="btn primary" id="start">Start quiz</button><button class="btn secondary hidden" id="resume">Resume quiz</button></div>
    </section>

    <section class="panel quiz" id="quiz" aria-live="polite"><div class="qhead"><div class="counter" id="counter">Question 1 of 10</div><div class="track"><div class="fill" id="fill"></div></div></div><h2 class="qtext" id="qtext"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"><strong id="ftitle"></strong><p id="ftext"></p></div><div class="qactions"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next" disabled>Next</button></div></section>
    <section class="panel result" id="result" aria-live="polite"><div class="ring" id="ring" style="--angle:0deg"><span id="score">0/10</span></div><p class="eyebrow">Result</p><h2 id="rtitle">Completed.</h2><p class="result-copy" id="rcopy"></p><div class="review" id="review"></div><div class="actions"><button class="btn primary" id="restart">Retake quiz</button><button class="btn secondary" id="copy">Copy result</button></div></section>
  </main>
  <script type="module">
    const questions=Object.freeze([{prompt:"A colleague asks you a general privacy question. What is the Privacy Champion’s first practical role?",options:["Act as the first contact on privacy topics and involve the DPO when needed.","Give final legal advice without escalation.","Forward every question to IT immediately.","Ignore the question unless it comes from management."],answer:0,explanation:"Privacy Champions are the local first contact. They should involve the DPO when the question needs specialist input or escalation.",topic:"Privacy Champion role"},{prompt:"For applicants and new colleagues, which action best reflects the privacy guidance?",options:["Collect all information that may be useful later.","Send the privacy notice, collect only needed data, and delete rejected CVs unless retention applies.","Keep rejected CVs indefinitely for possible future roles.","Share candidate documents with anyone involved in hiring across the group."],answer:1,explanation:"The practical rule is notice, minimisation and deletion where no valid retention reason exists.",topic:"Recruitment privacy"},{prompt:"A new vendor or website is being introduced. What should be checked or updated?",options:["Only the commercial contract, because privacy is handled later.","The DPA template only; no other documents are relevant.","The correct DPA template plus the notice, cookie statement, banner and ROPA where relevant.","Nothing until a data subject complains."],answer:2,explanation:"New vendors and websites can affect agreements, transparency materials, cookies and the ROPA. They should be handled together.",topic:"Vendors and websites"},{prompt:"A business team wants to implement a new system that processes personal data. What is the best first response?",options:["Check whether a DPIA is needed, review security, inform the DPO, and update the ROPA.","Approve it if the supplier is well known.","Wait until go-live and then ask for screenshots.","Ask the team to delete the system from the procurement file."],answer:0,explanation:"New systems are privacy change triggers. DPIA need, security, DPO involvement and ROPA updates should be considered early.",topic:"New systems"},{prompt:"Which rule applies to marketing emails under the guidance?",options:["Marketing emails are fine if the recipient works in business real estate.","Prior consent is required, and the email must include an unsubscribe link.","Only an unsubscribe link is needed; consent is optional.","Consent is needed only for external recipients outside the EEA."],answer:1,explanation:"The guidance is simple: prior consent plus a clear unsubscribe link.",topic:"Marketing"},{prompt:"Which situation should be treated as a possible personal data breach?",options:["Only confirmed hacking by an external attacker.","A wrong recipient, lost device, hacking, or unavailable personal data.","Only a breach that affects special category data.","Only a breach that has already been reported to a regulator."],answer:1,explanation:"The guidance treats wrong recipients, lost devices, hacking and data unavailability as possible breach scenarios that need assessment.",topic:"Data breaches"},{prompt:"A possible data breach occurs. Which escalation route is most aligned with the guidance?",options:["Notify IT and email privacy@vastint.eu; involve the local law firm when needed.","Wait until the next annual review.","Ask the affected colleague to decide whether to report it.","Only tell the supplier, because internal escalation creates records."],answer:0,explanation:"Speed matters. The expected route is IT plus the central privacy mailbox, with local legal involvement where needed.",topic:"Escalation"},{prompt:"Which daily habit best supports privacy compliance?",options:["Keep desks and screens clear, lock screens when away, and share personal data only on a need-to-know basis using approved tools.","Keep printed files visible so colleagues can help faster.","Send files through any tool that is fastest.","Leave systems open during short breaks to save time."],answer:0,explanation:"Clean desk, locked screens and controlled sharing are basic controls that reduce avoidable privacy risk.",topic:"Daily habits"},{prompt:"A Data Subject Request is received. What is the standard response deadline?",options:["10 business days from when the privacy team first reads it.","30 calendar days from receipt by the organisation.","60 calendar days in all cases.","There is no fixed deadline if the request is broad."],answer:1,explanation:"The 30-day period starts when the organisation receives the request, not when the central privacy team becomes aware of it.",topic:"DSR timelines"},{prompt:"Before disclosing information in response to a DSR, what identity check is expected?",options:["Confirm at least one data point, such as the requester’s name.","No identity check is needed if the email looks professional.","Confirm multiple data points, at least three; if someone acts for the data subject, require written authorisation.","Ask the requester to send a public social-media profile."],answer:2,explanation:"Identity verification protects the data subject. The procedure expects at least three data points, and written authority for representatives.",topic:"DSR identity verification"}]);
    const key="vastint-privacy-quiz-v2",$=s=>document.querySelector(s),el={intro:$("#intro"),quiz:$("#quiz"),result:$("#result"),start:$("#start"),resume:$("#resume"),restart:$("#restart"),copy:$("#copy"),status:$("#status"),counter:$("#counter"),fill:$("#fill"),qtext:$("#qtext"),answers:$("#answers"),feedback:$("#feedback"),ftitle:$("#ftitle"),ftext:$("#ftext"),back:$("#back"),next:$("#next"),ring:$("#ring"),score:$("#score"),rtitle:$("#rtitle"),rcopy:$("#rcopy"),review:$("#review")};
    const blank=()=>({started:false,complete:false,index:0,answers:Array(questions.length).fill(null),sessionId:crypto?.randomUUID?.()??String(Date.now())});let state=load()??blank();
    function load(){try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x?.answers)&&x.answers.length===questions.length?{...blank(),...x}:null}catch{return null}}function save(){localStorage.setItem(key,JSON.stringify(state));resumeBtn()}function clear(){localStorage.removeItem(key);resumeBtn()}function resumeBtn(){const s=load();el.resume.classList.toggle("hidden",!(s?.started&&!s?.complete))}function start(resume=false){if(!resume)state=blank();state.started=true;state.complete=false;save();render();el.quiz.scrollIntoView({block:"start"})}function score(){return state.answers.reduce((t,a,i)=>t+Number(a===questions[i].answer),0)}function render(){el.intro.classList.toggle("hidden",state.started);el.quiz.classList.toggle("active",state.started&&!state.complete);el.result.classList.toggle("active",state.complete);el.status.textContent=state.complete?`Complete · ${score()}/10`:state.started?`In progress · ${state.index+1}/10`:"Ready · 10 questions";if(state.started&&!state.complete)renderQ();if(state.complete)renderR();resumeBtn()}function renderQ(){const q=questions[state.index],sel=state.answers[state.index],done=sel!==null,pct=((state.index+Number(done))/questions.length)*100;el.counter.textContent=`Question ${state.index+1} of ${questions.length}`;el.fill.style.width=`${Math.max(4,pct)}%`;el.qtext.textContent=q.prompt;el.answers.innerHTML="";q.options.forEach((text,i)=>{const b=document.createElement("button");b.className="answer";b.type="button";b.disabled=done;if(done&&i===q.answer)b.classList.add("correct");if(done&&i===sel&&sel!==q.answer)b.classList.add("wrong");b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${text}</span>`;b.onclick=()=>answer(i);el.answers.append(b)});el.feedback.classList.toggle("active",done);el.ftitle.textContent=done&&sel===q.answer?"Correct.":"Incorrect.";el.ftext.textContent=done?q.explanation:"";el.back.disabled=state.index===0;el.next.disabled=!done;el.next.textContent=state.index===questions.length-1?"See result":"Next";el.status.textContent=`In progress · ${state.index+1}/10`}function answer(i){if(state.answers[state.index]!==null)return;state.answers[state.index]=i;save();renderQ()}function move(d){state.index=Math.min(Math.max(state.index+d,0),questions.length-1);save();renderQ()}function finish(){state.complete=true;save();renderR();el.result.scrollIntoView({block:"start"})}function renderR(){const total=score(),pct=Math.round(total/questions.length*100);el.intro.classList.add("hidden");el.quiz.classList.remove("active");el.result.classList.add("active");el.score.textContent=`${total}/${questions.length}`;el.ring.style.setProperty("--angle",`${pct*3.6}deg`);el.status.textContent=`Complete · ${total}/10`;el.rtitle.textContent=pct>=80?"Passed.":"Review needed.";el.rcopy.textContent=pct>=80?"Score meets the suggested pass mark.":"Review the missed questions before applying the process in practice.";el.review.innerHTML="";questions.forEach((q,i)=>{const ok=state.answers[i]===q.answer,item=document.createElement("div");item.className="review-item";item.innerHTML=`<span class="icon ${ok?"":"missed"}">${ok?"✓":"!"}</span><div><p><strong>${i+1}. ${q.topic}</strong> — ${ok?"Correct":`Correct answer: ${q.options[q.answer]}`}</p><small>${q.explanation}</small></div>`;el.review.append(item)})}
    el.start.onclick=()=>start(false);el.resume.onclick=()=>start(true);el.back.onclick=()=>move(-1);el.next.onclick=()=>state.index===questions.length-1?finish():move(1);el.restart.onclick=()=>{clear();state=blank();start(false)};el.copy.onclick=async()=>{const t=`Vastint Privacy Champions Training quiz result: ${score()}/${questions.length}`;try{await navigator.clipboard.writeText(t);el.copy.textContent="Copied";setTimeout(()=>el.copy.textContent="Copy result",1200)}catch{el.copy.textContent=t}};window.addEventListener("keydown",e=>{if(!state.started||state.complete)return;const sel=state.answers[state.index];if(["1","2","3","4"].includes(e.key)&&sel===null)answer(Number(e.key)-1);if((e.key==="Enter"||e.key==="ArrowRight")&&sel!==null)(state.index===questions.length-1?finish():move(1));if(e.key==="ArrowLeft")move(-1)});render();
  </script>
</body>
</html>
